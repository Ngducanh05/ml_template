name: Local validation

on:
  workflow_call:
    inputs:
      exact_runtime_image:
        required: true
        type: string
      exact_artifact_image:
        required: true
        type: string
      ticket_reference:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Validate on Docker Desktop Kubernetes
    runs-on: [self-hosted, Windows, X64, model-service-validation]
    timeout-minutes: 15
    concurrency:
      group: model-service-local-validation
      cancel-in-progress: false
    env:
      EXACT_RUNTIME_IMAGE: ${{ inputs.exact_runtime_image }}
      EXACT_ARTIFACT_IMAGE: ${{ inputs.exact_artifact_image }}
      TICKET_REFERENCE: ${{ inputs.ticket_reference }}
      DEPLOYMENT_ENVIRONMENT: validation
      KUBE_CONTEXT: docker-desktop
      KUBE_NAMESPACE: ${{ vars.VALIDATION_NAMESPACE }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ github.run_id }}
          path: evidence
      - name: Deploy the scanned pair, verify rollout, readiness and smoke test
        shell: powershell
        run: |
          python scripts/release.py deploy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/validation.json
          if-no-files-found: error
          retention-days: 30
