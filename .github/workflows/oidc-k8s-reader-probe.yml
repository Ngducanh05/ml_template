name: OIDC EKS Reader Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'Ngducanh05/ml_template' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Assume dedicated Kubernetes Reader
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::596432515999:role/ml-template-v2-k8s-reader
          aws-region: ap-southeast-1
          role-duration-seconds: 900

      - name: Verify identity and token generation
        shell: bash
        run: |
          set -euo pipefail

          identity="$(aws sts get-caller-identity --query Arn --output text)"

          [[ "$identity" == arn:aws:sts::596432515999:assumed-role/ml-template-v2-k8s-reader/* ]]

          aws eks get-token \
            --cluster-name ml-template-dev-sg \
            --region ap-southeast-1 \
            --output json |
            python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["kind"] == "ExecCredential"; assert p["status"]["token"].startswith("k8s-aws-v1."); print("OIDC_K8S_TOKEN_GENERATION_PASS")'

          echo "OIDC_K8S_READER_STS_PASS"