name: Runtime BUILD_REQUIRED trigger
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: runtime-build-trigger
  cancel-in-progress: false
jobs:
  observe-and-dispatch:
    runs-on: [self-hosted, Linux, X64, mlops-release-readonly]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r control_plane/requirements-v2.txt
      - name: Initialize temporary Release State snapshot path
        shell: bash
        run: |
          set -euo pipefail
          snapshot_path="${RUNNER_TEMP}/release-state-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf 'RELEASE_STATE_READER_SNAPSHOT=%s\n' "$snapshot_path" >> "$GITHUB_ENV"
      - name: Assume dedicated Kubernetes Release State Reader
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::596432515999:role/ml-template-v2-k8s-reader
          aws-region: ap-southeast-1
          role-duration-seconds: 900
      - name: Read exact Release State through OIDC and scoped EKS RBAC
        run: >-
          python -m control_plane.oidc_eks_reader
          --output "$RELEASE_STATE_READER_SNAPSHOT"
      - name: Assume dedicated ECR Catalog Reader
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.RELEASE_CATALOG_READ_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 900
      - name: Read exact state, check catalog and dispatch existing build once
        run: python -m scripts.runtime_build_trigger
      - name: Remove temporary non-secret Release State snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_STATE_READER_SNAPSHOT:-}" ]]; then
            rm -f -- "$RELEASE_STATE_READER_SNAPSHOT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-build-trigger-${{ github.run_id }}
          path: evidence/runtime-build-trigger.json
          retention-days: 30
          if-no-files-found: error
