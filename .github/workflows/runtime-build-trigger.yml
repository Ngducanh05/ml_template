name: Runtime BUILD_REQUIRED trigger
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: runtime-build-trigger
  cancel-in-progress: false
jobs:
  observe-and-dispatch:
    runs-on: [self-hosted, Linux, X64, mlops-release-readonly]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r control_plane/requirements-v2.txt
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.RELEASE_CATALOG_READ_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 900
      - name: Read exact state, check catalog and dispatch existing build once
        env:
          RELEASE_STATE_READER_B64: ${{ secrets.RELEASE_STATE_READER_B64 }}
        run: python -m scripts.runtime_build_trigger
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-build-trigger-${{ github.run_id }}
          path: evidence/runtime-build-trigger.json
          retention-days: 30
          if-no-files-found: error
