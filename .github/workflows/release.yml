name: Release
run-name: Release ${{ github.ref_name }} model ${{ inputs.model_version }} by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      ticket_reference:
        description: Non-sensitive approved ticket reference; reviewer must independently verify
        required: true
        type: string
      model_version:
        description: Exact latest eligible v2 candidate version
        required: true
        type: string
      runtime_evidence_source:
        description: Explicit independently verified security provenance source
        required: true
        type: choice
        options: [workflow_run, retained_provenance]
        default: workflow_run
      runtime_provenance_digest:
        description: Reviewed retained record sha256 digest; only for retained_provenance
        required: false
        type: string
      runtime_evidence_run_id:
        description: Successful Generic Runtime Build run; only for workflow_run
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: model-service-release
  cancel-in-progress: false
env:
  TICKET_REFERENCE: ${{ inputs.ticket_reference }}
  MODEL_VERSION: ${{ inputs.model_version }}
  RUNTIME_EVIDENCE_SOURCE: ${{ inputs.runtime_evidence_source }}
  RUNTIME_PROVENANCE_DIGEST: ${{ inputs.runtime_provenance_digest }}
  RUNTIME_EVIDENCE_RUN_ID: ${{ inputs.runtime_evidence_run_id }}
  PYTHONPATH: .:src
jobs:
  validation:
    name: Validate controlled release source and run required tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Validate immutable release tag, main ancestry, SHA, workflow and ticket
        run: python -m scripts.release_v2 source
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=evidence/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  preflight:
    name: Verify exact ServingPair, runtime build/security evidence and protected ticket gate
    needs: validation
    runs-on: [self-hosted, Linux, X64, mlops-release-readonly]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r control_plane/requirements-v2.txt
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.RELEASE_CATALOG_READ_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 900
      - name: Read-only preproduction checks; never materialize production Canary
        env:
          RELEASE_STATE_READER_B64: ${{ secrets.RELEASE_STATE_READER_B64 }}
        run: python -m scripts.release_v2 preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  production:
    name: Human verifies approved ticket, then authorize exact v2 candidate
    needs: [validation, preflight]
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: [self-hosted, Linux, X64, mlops-release-authorizer]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: evidence
      - run: python -m pip install -r control_plane/requirements-v2.txt
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.RELEASE_CATALOG_READ_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-duration-seconds: 900
      - name: Recheck native review, identity and security, then authorize through CAS
        env:
          RELEASE_STATE_WRITER_B64: ${{ secrets.RELEASE_STATE_WRITER_B64 }}
        run: python -m scripts.release_v2 authorize
      - name: Observe durable Controller outcome without changing workloads
        env:
          RELEASE_STATE_WRITER_B64: ${{ secrets.RELEASE_STATE_WRITER_B64 }}
        run: python -m scripts.release_v2 observe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-production-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  audit:
    name: Audit authorization separately from rollout success
    if: always()
    needs: [validation, preflight, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-*
          path: evidence
          merge-multiple: true
      - name: No deployment success without exact durable terminal evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -m scripts.release_v2 summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-audit-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
