apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  labels:
    app.kubernetes.io/name: model-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: model-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-service
    spec:
      imagePullSecrets:
        - name: model-service-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: model-artifact
          image: ARTIFACT_IMAGE_REQUIRED
          volumeMounts:
            - name: model-volume
              mountPath: /models
              readOnly: false
      containers:
        - name: model-service
          # scripts/release.py replaces this locally before applying the manifest.
          image: RUNTIME_IMAGE_REQUIRED
          volumeMounts:
            - name: model-volume
              mountPath: /models
              readOnly: true
          envFrom:
            - configMapRef:
                name: model-service-config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
      volumes:
        - name: model-volume
          emptyDir: {}
