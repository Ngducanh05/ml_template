apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  labels:
    app.kubernetes.io/name: model-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: model-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: model-service
          image: model-service:validation
          envFrom:
            - configMapRef:
                name: model-service-config
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
