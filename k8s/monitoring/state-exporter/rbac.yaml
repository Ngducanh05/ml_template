apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-v2-state-exporter
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-v2-state-exporter
  namespace: production
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [model-release-state-v2]
    verbs: [get]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    resourceNames: [credit-risk-stable-v2, credit-risk-canary-v2]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-v2-state-exporter
  namespace: production
subjects:
  - kind: ServiceAccount
    name: mlops-v2-state-exporter
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-v2-state-exporter
