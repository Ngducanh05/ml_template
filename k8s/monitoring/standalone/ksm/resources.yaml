apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics-v2
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics-v2
  namespace: production
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics-v2
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics-v2
subjects:
- kind: ServiceAccount
  name: kube-state-metrics-v2
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-v2
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-v2
subjects:
- kind: ServiceAccount
  name: kube-state-metrics-v2
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics-v2
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics-v2
  template:
    metadata:
      labels:
        app: kube-state-metrics-v2
    spec:
      serviceAccountName: kube-state-metrics-v2
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ksm
        image: IMAGE_DIGEST_REQUIRED
        args:
        - --resources=nodes,pods,deployments,horizontalpodautoscalers
        - --namespaces=production
        - --port=8080
        - --telemetry-port=8081
        ports:
        - name: metrics
          containerPort: 8080
        - name: telemetry
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-v2
  namespace: production
spec:
  selector:
    app: kube-state-metrics-v2
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
