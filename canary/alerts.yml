groups:
  - name: local-canary
    rules:
      - alert: CanaryDown
        expr: up{job="model-service",track="canary"} == 0
        labels:
          severity: critical
        annotations:
          summary: Canary scrape target is down
      - alert: CanaryTargetMissing
        expr: absent(up{job="model-service",track="canary"})
        labels:
          severity: critical
      - alert: CanaryNoTraffic
        expr: (sum(increase(model_service_http_requests_total{track="canary",route="/api/v1/predict"}[30s])) <= 0 or absent(model_service_http_requests_total{track="canary",route="/api/v1/predict"})) and on() (canary_router_weight_percent > 0)
        for: 35s
        labels:
          severity: warning
      - alert: CanaryErrors
        expr: sum(rate(canary_router_requests_total{track="canary",status=~"5.."}[30s])) / sum(rate(canary_router_requests_total{track="canary"}[30s])) >= 0.05
        labels:
          severity: critical
      - alert: CanaryLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(model_service_http_request_duration_seconds_bucket{track="canary",route="/api/v1/predict"}[30s]))) >= 0.1
        labels:
          severity: warning
