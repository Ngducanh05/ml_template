global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - CANARY_ALERT_RULES
scrape_configs:
  - job_name: model-service
    static_configs:
      - targets: ['127.0.0.1:18081']
        labels:
          track: stable
      - targets: ['127.0.0.1:18082']
        labels:
          track: canary
  - job_name: canary-router
    static_configs:
      - targets: ['127.0.0.1:8080']
