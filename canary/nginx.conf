events {}

http {
    split_clients "${request_id}" $route {
        90% stable;
        *   canary;
    }

    upstream stable {
        server host.docker.internal:8081;
    }

    upstream canary {
        server host.docker.internal:8082;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://$route;

            add_header X-Lab-Route $route always;
        }
    }
}